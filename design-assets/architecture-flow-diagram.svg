<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Layer tint gradients -->
    <linearGradient id="userLayerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E9F3FF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#E9F3FF;stop-opacity:0.4" />
    </linearGradient>

    <linearGradient id="presentationLayerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EFE9FF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#EFE9FF;stop-opacity:0.4" />
    </linearGradient>

    <linearGradient id="applicationLayerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EAF8F0;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#EAF8F0;stop-opacity:0.4" />
    </linearGradient>

    <linearGradient id="dataLayerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E6F7F6;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#E6F7F6;stop-opacity:0.4" />
    </linearGradient>

    <linearGradient id="integrationLayerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F1F3F5;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#F1F3F5;stop-opacity:0.4" />
    </linearGradient>

    <!-- Component shadows -->
    <filter id="componentShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>

    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6B7280" />
    </marker>

    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F97316" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#F4F6F8"/>

  <!-- Title -->
  <text x="960" y="60" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#1F2937" text-anchor="middle">
    Software Architecture Flow Diagram
  </text>
  <text x="960" y="95" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#6B7280" text-anchor="middle">
    Best Practices: Left→Right Flow | Top→Bottom Layers
  </text>

  <!-- LAYER 1: USER LAYER -->
  <g id="userLayer">
    <rect x="100" y="150" width="1720" height="120" rx="12" fill="url(#userLayerBg)" stroke="#3B82F6" stroke-width="2"/>
    <text x="120" y="180" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-transform="uppercase" letter-spacing="1">
      USER LAYER
    </text>

    <!-- User Node -->
    <g transform="translate(300, 200)" filter="url(#componentShadow)">
      <rect x="0" y="0" width="140" height="60" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
      <text x="70" y="28" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1E40AF" text-anchor="middle">User</text>
      <text x="70" y="46" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#3B82F6" text-anchor="middle">Browser/Mobile</text>
    </g>
  </g>

  <!-- LAYER 2: PRESENTATION LAYER -->
  <g id="presentationLayer">
    <rect x="100" y="310" width="1720" height="120" rx="12" fill="url(#presentationLayerBg)" stroke="#8B5CF6" stroke-width="2"/>
    <text x="120" y="340" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-transform="uppercase" letter-spacing="1">
      PRESENTATION LAYER
    </text>

    <!-- Web App Node -->
    <g transform="translate(550, 360)" filter="url(#componentShadow)">
      <rect x="0" y="0" width="140" height="60" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
      <text x="70" y="28" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#6B21A8" text-anchor="middle">Web App</text>
      <text x="70" y="46" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#8B5CF6" text-anchor="middle">React/Next.js</text>
    </g>
  </g>

  <!-- LAYER 3: APPLICATION LAYER -->
  <g id="applicationLayer">
    <rect x="100" y="470" width="1720" height="180" rx="12" fill="url(#applicationLayerBg)" stroke="#10B981" stroke-width="2"/>
    <text x="120" y="500" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-transform="uppercase" letter-spacing="1">
      APPLICATION LAYER
    </text>

    <!-- API Gateway Node -->
    <g transform="translate(800, 520)" filter="url(#componentShadow)">
      <rect x="0" y="0" width="140" height="60" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
      <text x="70" y="28" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#065F46" text-anchor="middle">API Gateway</text>
      <text x="70" y="46" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#10B981" text-anchor="middle">REST/GraphQL</text>
    </g>

    <!-- Queue Node (parallelogram) -->
    <g transform="translate(1000, 540)" filter="url(#componentShadow)">
      <polygon points="10,0 90,0 110,40 30,40" fill="#FED7AA" stroke="#F97316" stroke-width="2"/>
      <text x="60" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#9A3412" text-anchor="middle">Queue</text>
    </g>

    <!-- Service Node -->
    <g transform="translate(1150, 520)" filter="url(#componentShadow)">
      <rect x="0" y="0" width="140" height="60" rx="8" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
      <text x="70" y="28" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#134E4A" text-anchor="middle">Service</text>
      <text x="70" y="46" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#14B8A6" text-anchor="middle">Business Logic</text>
    </g>
  </g>

  <!-- LAYER 4: DATA LAYER -->
  <g id="dataLayer">
    <rect x="100" y="690" width="1720" height="150" rx="12" fill="url(#dataLayerBg)" stroke="#0EA5E9" stroke-width="2"/>
    <text x="120" y="720" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-transform="uppercase" letter-spacing="1">
      DATA LAYER
    </text>

    <!-- Database Node (cylinder) -->
    <g transform="translate(1150, 750)" filter="url(#componentShadow)">
      <ellipse cx="70" cy="0" rx="70" ry="15" fill="#BAE6FD" stroke="#0284C7" stroke-width="2"/>
      <rect x="0" y="0" width="140" height="60" fill="#BAE6FD"/>
      <line x1="0" y1="0" x2="0" y2="60" stroke="#0284C7" stroke-width="2"/>
      <line x1="140" y1="0" x2="140" y2="60" stroke="#0284C7" stroke-width="2"/>
      <ellipse cx="70" cy="60" rx="70" ry="15" fill="#BAE6FD" stroke="#0284C7" stroke-width="2"/>
      <text x="70" y="35" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#075985" text-anchor="middle">Database</text>
      <text x="70" y="52" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#0284C7" text-anchor="middle">PostgreSQL</text>
    </g>

    <!-- Cache Node (rounded square with lightning) -->
    <g transform="translate(950, 760)" filter="url(#componentShadow)">
      <rect x="0" y="0" width="100" height="60" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
      <text x="50" y="30" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#991B1B" text-anchor="middle">Cache</text>
      <text x="50" y="48" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#DC2626" text-anchor="middle">Redis</text>
      <path d="M 70 10 L 60 25 L 67 25 L 57 40 L 72 22 L 65 22 Z" fill="#F59E0B" stroke="#F59E0B" stroke-width="1"/>
    </g>
  </g>

  <!-- LAYER 5: INTEGRATION LAYER -->
  <g id="integrationLayer">
    <rect x="100" y="880" width="1720" height="120" rx="12" fill="url(#integrationLayerBg)" stroke="#6B7280" stroke-width="2"/>
    <text x="120" y="910" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-transform="uppercase" letter-spacing="1">
      INTEGRATION LAYER
    </text>

    <!-- External API Node (hexagon) -->
    <g transform="translate(1440, 930)" filter="url(#componentShadow)">
      <polygon points="35,0 105,0 140,30 105,60 35,60 0,30" fill="#E5E7EB" stroke="#6B7280" stroke-width="2"/>
      <text x="70" y="32" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#374151" text-anchor="middle">External API</text>
      <text x="70" y="48" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280" text-anchor="middle">3rd Party</text>
    </g>
  </g>

  <!-- CONNECTORS -->

  <!-- User to Web App (vertical, gray) -->
  <path d="M 370 260 L 370 320 L 620 320 L 620 360" stroke="#6B7280" stroke-width="3" fill="none" marker-end="url(#arrowGray)"/>

  <!-- Web App to API Gateway (horizontal, blue) -->
  <path d="M 690 390 L 800 390 L 800 550" stroke="#3B82F6" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- API Gateway to Service (horizontal, blue) -->
  <path d="M 940 550 L 1150 550" stroke="#3B82F6" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- API Gateway to Queue (dashed, orange, async) -->
  <path d="M 870 580 L 870 610 L 1050 610 L 1050 580" stroke="#F97316" stroke-width="3" fill="none" stroke-dasharray="10,5" marker-end="url(#arrowOrange)"/>

  <!-- Queue to Service (dashed, orange) -->
  <path d="M 1110 560 L 1220 560" stroke="#F97316" stroke-width="3" fill="none" stroke-dasharray="10,5" marker-end="url(#arrowOrange)"/>

  <!-- Service to Database (vertical, blue) -->
  <path d="M 1220 580 L 1220 750" stroke="#3B82F6" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- Service to Cache (horizontal then vertical, blue) -->
  <path d="M 1150 550 L 1000 550 L 1000 760" stroke="#3B82F6" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- Service to External API (dotted, bidirectional gray) -->
  <path d="M 1290 550 L 1440 550 L 1440 930" stroke="#6B7280" stroke-width="3" fill="none" stroke-dasharray="2,4" marker-end="url(#arrowGray)"/>
  <path d="M 1510 930 L 1510 550 L 1290 550" stroke="#6B7280" stroke-width="3" fill="none" stroke-dasharray="2,4" marker-end="url(#arrowGray)"/>

  <!-- ANNOTATIONS / LEGEND -->
  <g id="legend" transform="translate(120, 1020)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1F2937">
      LEGEND:
    </text>

    <!-- Synchronous -->
    <line x1="10" y1="25" x2="60" y2="25" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="70" y="30" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#1F2937">
      Synchronous (HTTP/gRPC)
    </text>

    <!-- Asynchronous -->
    <line x1="300" y1="25" x2="350" y2="25" stroke="#F97316" stroke-width="3" stroke-dasharray="10,5" marker-end="url(#arrowOrange)"/>
    <text x="360" y="30" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#1F2937">
      Asynchronous (Message Queue)
    </text>

    <!-- External -->
    <line x1="600" y1="25" x2="650" y2="25" stroke="#6B7280" stroke-width="3" stroke-dasharray="2,4" marker-end="url(#arrowGray)"/>
    <text x="660" y="30" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#1F2937">
      External Integration (Bidirectional)
    </text>
  </g>

  <!-- BEST PRACTICES CALLOUTS -->
  <g id="callouts">
    <!-- Callout 1 -->
    <rect x="1450" y="180" width="320" height="100" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#componentShadow)"/>
    <text x="1610" y="210" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#78350F" text-anchor="middle">
      Best Practice #1
    </text>
    <text x="1470" y="235" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#78350F">
      • Clear separation of concerns
    </text>
    <text x="1470" y="255" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#78350F">
      • Each layer has single responsibility
    </text>

    <!-- Callout 2 -->
    <rect x="1450" y="360" width="320" height="80" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" filter="url(#componentShadow)"/>
    <text x="1610" y="390" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1E40AF" text-anchor="middle">
      Best Practice #2
    </text>
    <text x="1470" y="415" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1E40AF">
      • Async patterns for long operations
    </text>

    <!-- Callout 3 -->
    <rect x="1450" y="520" width="320" height="100" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2" filter="url(#componentShadow)"/>
    <text x="1610" y="550" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">
      Best Practice #3
    </text>
    <text x="1470" y="575" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#065F46">
      • Caching layer for performance
    </text>
    <text x="1470" y="595" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#065F46">
      • Database optimization patterns
    </text>
  </g>
</svg>
