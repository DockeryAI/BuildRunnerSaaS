<svg width="2048" height="2048" viewBox="0 0 2048 2048" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions for glossy 3D effect -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3ED6BE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#30B9A6;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA930;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8A00;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FBDB6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7C843;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9B7FFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7E5BFF;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FDB97;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2FC97A;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5FBFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3BA9FF;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF77CA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4FB3;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6D727A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A5F66;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="defaultShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hoverShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="12" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.30"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gloss overlay -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="2048" height="2048" fill="#1B1B1F"/>

  <!-- Title -->
  <text x="1024" y="100" font-family="Inter, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    Workflow Node Buttons
  </text>
  <text x="1024" y="150" font-family="Inter, sans-serif" font-size="24" font-weight="500" fill="#9CA3AF" text-anchor="middle">
    Tactile 3D/Glossy Design System
  </text>

  <!-- FIRST ROW: START, MESSAGE, QUESTION, AI ANALYSIS -->

  <!-- 1. START NODE - CIRCLE - TEAL -->
  <g transform="translate(256, 400)" filter="url(#defaultShadow)">
    <circle cx="100" cy="100" r="80" fill="url(#tealGrad)"/>
    <!-- Gloss stripe -->
    <rect x="60" y="20" width="80" height="160" rx="40" fill="url(#gloss)" opacity="0.1"/>
    <!-- Icon: chat bubble -->
    <path d="M 70 80 Q 70 60, 90 60 L 110 60 Q 130 60, 130 80 L 130 100 Q 130 120, 110 120 L 95 120 L 85 130 L 85 120 Q 70 120, 70 100 Z" fill="#FFFFFF" opacity="0.9"/>
    <!-- Title -->
    <text x="100" y="220" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start</text>
    <text x="100" y="245" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#9CA3AF" text-anchor="middle">Entry</text>
  </g>

  <!-- 2. MESSAGE NODE - ROUNDED RECTANGLE - ORANGE -->
  <g transform="translate(656, 400)" filter="url(#defaultShadow)">
    <rect x="20" y="40" width="160" height="120" rx="20" fill="url(#orangeGrad)"/>
    <!-- Gloss stripe -->
    <rect x="60" y="40" width="30" height="120" fill="url(#gloss)" opacity="0.1"/>
    <!-- Icon: lightbulb -->
    <circle cx="100" cy="85" r="15" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.9"/>
    <path d="M 100 70 L 100 60" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <path d="M 90 105 L 110 105" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <path d="M 92 110 L 108 110" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
    <!-- Title -->
    <text x="100" y="200" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Message</text>
    <text x="100" y="225" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#9CA3AF" text-anchor="middle">Prompt</text>
  </g>

  <!-- 3. QUESTION NODE - HEXAGON - YELLOW -->
  <g transform="translate(1056, 400)" filter="url(#defaultShadow)">
    <polygon points="60,100 90,50 150,50 180,100 150,150 90,150" fill="url(#yellowGrad)"/>
    <!-- Gloss stripe -->
    <rect x="100" y="50" width="25" height="100" fill="url(#gloss)" opacity="0.1"/>
    <!-- Icon: question mark -->
    <text x="120" y="120" font-family="Inter, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="0.9">?</text>
    <!-- Title -->
    <text x="120" y="200" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Question</text>
    <text x="120" y="225" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#9CA3AF" text-anchor="middle">Ask</text>
  </g>

  <!-- 4. AI ANALYSIS NODE - DIAMOND - VIOLET -->
  <g transform="translate(1456, 400)" filter="url(#defaultShadow)">
    <polygon points="100,50 150,100 100,150 50,100" fill="url(#violetGrad)"/>
    <!-- Gloss stripe -->
    <rect x="85" y="50" width="30" height="100" fill="url(#gloss)" opacity="0.1" transform="rotate(45 100 100)"/>
    <!-- Icon: spark/brain -->
    <path d="M 90 95 L 100 85 L 110 95 M 100 85 L 100 115 M 95 105 L 105 105" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <circle cx="100" cy="95" r="3" fill="#FFFFFF" opacity="0.9"/>
    <!-- Title -->
    <text x="100" y="190" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">AI Analysis</text>
    <text x="100" y="215" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#9CA3AF" text-anchor="middle">Process</text>
  </g>

  <!-- SECOND ROW: CONDITION, BRAND DATA, BUTTONS, END -->

  <!-- 5. CONDITION NODE - PENTAGON - GREEN -->
  <g transform="translate(256, 800)" filter="url(#defaultShadow)">
    <polygon points="100,50 170,85 145,155 55,155 30,85" fill="url(#greenGrad)"/>
    <!-- Gloss stripe -->
    <rect x="85" y="50" width="30" height="105" fill="url(#gloss)" opacity="0.1"/>
    <!-- Icon: gear/toggle -->
    <circle cx="100" cy="105" r="20" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.9"/>
    <circle cx="100" cy="105" r="8" fill="#FFFFFF" opacity="0.9"/>
    <!-- Title -->
    <text x="100" y="205" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Condition</text>
    <text x="100" y="230" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#9CA3AF" text-anchor="middle">If/Else</text>
  </g>

  <!-- 6. BRAND DATA NODE - PARALLELOGRAM - BLUE -->
  <g transform="translate(656, 800)" filter="url(#defaultShadow)">
    <polygon points="50,60 150,60 190,140 90,140" fill="url(#blueGrad)"/>
    <!-- Gloss stripe -->
    <rect x="95" y="60" width="30" height="80" fill="url(#gloss)" opacity="0.1"/>
    <!-- Icon: database/cloud-download -->
    <ellipse cx="120" cy="85" rx="20" ry="12" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <ellipse cx="120" cy="95" rx="20" ry="12" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <path d="M 120 110 L 120 125 M 115 120 L 120 125 L 125 120" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <!-- Title -->
    <text x="120" y="190" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Brand Data</text>
    <text x="120" y="215" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#9CA3AF" text-anchor="middle">Pull</text>
  </g>

  <!-- 7. BUTTONS NODE - CAPSULE - PINK -->
  <g transform="translate(1056, 800)" filter="url(#defaultShadow)">
    <rect x="40" y="70" width="160" height="60" rx="30" fill="url(#pinkGrad)"/>
    <!-- Gloss stripe -->
    <rect x="90" y="70" width="30" height="60" fill="url(#gloss)" opacity="0.1"/>
    <!-- Icon: list/bullet -->
    <circle cx="90" cy="95" r="4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="90" cy="105" r="4" fill="#FFFFFF" opacity="0.9"/>
    <line x1="100" y1="95" x2="140" y2="95" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
    <line x1="100" y1="105" x2="140" y2="105" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
    <!-- Title -->
    <text x="120" y="180" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Buttons</text>
    <text x="120" y="205" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#9CA3AF" text-anchor="middle">Choices</text>
  </g>

  <!-- 8. END NODE - DOUBLE-RING CIRCLE - DARK GRAY -->
  <g transform="translate(1456, 800)" filter="url(#defaultShadow)">
    <circle cx="100" cy="100" r="80" fill="url(#grayGrad)"/>
    <circle cx="100" cy="100" r="60" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.3"/>
    <!-- Gloss stripe -->
    <rect x="60" y="20" width="80" height="160" rx="40" fill="url(#gloss)" opacity="0.1"/>
    <!-- Icon: stop-square -->
    <rect x="80" y="80" width="40" height="40" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <!-- Title -->
    <text x="100" y="220" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">End</text>
    <text x="100" y="245" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#9CA3AF" text-anchor="middle">Complete</text>
  </g>

  <!-- HOVER STATE SECTION -->
  <text x="1024" y="1150" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    Hover/Lift State
  </text>

  <!-- HOVER ROW 1: START, MESSAGE, QUESTION, AI ANALYSIS -->

  <!-- 1. START NODE HOVER -->
  <g transform="translate(256, 1280)" filter="url(#hoverShadow)">
    <circle cx="100" cy="98" r="80" fill="url(#tealGrad)" style="filter: brightness(1.1);"/>
    <rect x="60" y="18" width="80" height="160" rx="40" fill="url(#gloss)" opacity="0.1"/>
    <path d="M 70 78 Q 70 58, 90 58 L 110 58 Q 130 58, 130 78 L 130 98 Q 130 118, 110 118 L 95 118 L 85 128 L 85 118 Q 70 118, 70 98 Z" fill="#FFFFFF" opacity="0.9"/>
    <text x="100" y="218" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start</text>
    <text x="100" y="243" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#9CA3AF" text-anchor="middle">Entry</text>
  </g>

  <!-- 2. MESSAGE NODE HOVER -->
  <g transform="translate(656, 1280)" filter="url(#hoverShadow)">
    <rect x="20" y="38" width="160" height="120" rx="20" fill="url(#orangeGrad)" style="filter: brightness(1.1);"/>
    <rect x="60" y="38" width="30" height="120" fill="url(#gloss)" opacity="0.1"/>
    <circle cx="100" cy="83" r="15" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.9"/>
    <path d="M 100 68 L 100 58" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <path d="M 90 103 L 110 103" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <path d="M 92 108 L 108 108" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
    <text x="100" y="198" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Message</text>
    <text x="100" y="223" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#9CA3AF" text-anchor="middle">Prompt</text>
  </g>

  <!-- 3. QUESTION NODE HOVER -->
  <g transform="translate(1056, 1280)" filter="url(#hoverShadow)">
    <polygon points="60,98 90,48 150,48 180,98 150,148 90,148" fill="url(#yellowGrad)" style="filter: brightness(1.1);"/>
    <rect x="100" y="48" width="25" height="100" fill="url(#gloss)" opacity="0.1"/>
    <text x="120" y="118" font-family="Inter, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="0.9">?</text>
    <text x="120" y="198" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Question</text>
    <text x="120" y="223" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#9CA3AF" text-anchor="middle">Ask</text>
  </g>

  <!-- 4. AI ANALYSIS NODE HOVER -->
  <g transform="translate(1456, 1280)" filter="url(#hoverShadow)">
    <polygon points="100,48 150,98 100,148 50,98" fill="url(#violetGrad)" style="filter: brightness(1.1);"/>
    <rect x="85" y="48" width="30" height="100" fill="url(#gloss)" opacity="0.1" transform="rotate(45 100 98)"/>
    <path d="M 90 93 L 100 83 L 110 93 M 100 83 L 100 113 M 95 103 L 105 103" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <circle cx="100" cy="93" r="3" fill="#FFFFFF" opacity="0.9"/>
    <text x="100" y="188" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">AI Analysis</text>
    <text x="100" y="213" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#9CA3AF" text-anchor="middle">Process</text>
  </g>

  <!-- HOVER ROW 2: CONDITION, BRAND DATA, BUTTONS, END -->

  <!-- 5. CONDITION NODE HOVER -->
  <g transform="translate(256, 1680)" filter="url(#hoverShadow)">
    <polygon points="100,48 170,83 145,153 55,153 30,83" fill="url(#greenGrad)" style="filter: brightness(1.1);"/>
    <rect x="85" y="48" width="30" height="105" fill="url(#gloss)" opacity="0.1"/>
    <circle cx="100" cy="103" r="20" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.9"/>
    <circle cx="100" cy="103" r="8" fill="#FFFFFF" opacity="0.9"/>
    <text x="100" y="203" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Condition</text>
    <text x="100" y="228" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#9CA3AF" text-anchor="middle">If/Else</text>
  </g>

  <!-- 6. BRAND DATA NODE HOVER -->
  <g transform="translate(656, 1680)" filter="url(#hoverShadow)">
    <polygon points="50,58 150,58 190,138 90,138" fill="url(#blueGrad)" style="filter: brightness(1.1);"/>
    <rect x="95" y="58" width="30" height="80" fill="url(#gloss)" opacity="0.1"/>
    <ellipse cx="120" cy="83" rx="20" ry="12" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <ellipse cx="120" cy="93" rx="20" ry="12" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <path d="M 120 108 L 120 123 M 115 118 L 120 123 L 125 118" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <text x="120" y="188" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Brand Data</text>
    <text x="120" y="213" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#9CA3AF" text-anchor="middle">Pull</text>
  </g>

  <!-- 7. BUTTONS NODE HOVER -->
  <g transform="translate(1056, 1680)" filter="url(#hoverShadow)">
    <rect x="40" y="68" width="160" height="60" rx="30" fill="url(#pinkGrad)" style="filter: brightness(1.1);"/>
    <rect x="90" y="68" width="30" height="60" fill="url(#gloss)" opacity="0.1"/>
    <circle cx="90" cy="93" r="4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="90" cy="103" r="4" fill="#FFFFFF" opacity="0.9"/>
    <line x1="100" y1="93" x2="140" y2="93" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
    <line x1="100" y1="103" x2="140" y2="103" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
    <text x="120" y="178" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Buttons</text>
    <text x="120" y="203" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#9CA3AF" text-anchor="middle">Choices</text>
  </g>

  <!-- 8. END NODE HOVER -->
  <g transform="translate(1456, 1680)" filter="url(#hoverShadow)">
    <circle cx="100" cy="98" r="80" fill="url(#grayGrad)" style="filter: brightness(1.1);"/>
    <circle cx="100" cy="98" r="60" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.3"/>
    <rect x="60" y="18" width="80" height="160" rx="40" fill="url(#gloss)" opacity="0.1"/>
    <rect x="80" y="78" width="40" height="40" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <text x="100" y="218" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">End</text>
    <text x="100" y="243" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#9CA3AF" text-anchor="middle">Complete</text>
  </g>
</svg>
